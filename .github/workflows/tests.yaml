name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt ruff
      - name: Lint
        run: ruff check custom_components tests dev && ruff format --check custom_components tests dev
      - name: Test
        run: python -m pytest -q
      - name: Test the dashboard card
        run: node --check custom_components/kubu_ble/frontend/kubu-ble-card.js && node --test tests/js/*.test.mjs
